@if (screen() === 'home') {
  <main class="home">
    <h1>ツール選択</h1>
    <div class="menu">
      <button type="button" class="menu-btn" (click)="goTo('pokemon')">ポケモン</button>
      <button type="button" class="menu-btn" (click)="goTo('kanji')">漢字</button>
    </div>
  </main>
} @else if (screen() === 'pokemon') {
  <app-pokemon-feature (back)="goTo('home')" />
} @else {
  <app-kanji-feature (back)="goTo('home')" />
}
